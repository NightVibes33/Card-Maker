name: Build Blitz catalog snapshot

on:
  push:
    branches:
      - blitz-snapshot-build
    paths:
      - scripts/snapshot-blitz.mjs

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install snapshot dependencies
        run: npm install --no-save --no-audit --no-fund cheerio
      - name: Build Blitz catalog snapshot
        run: node scripts/snapshot-blitz.mjs
      - name: Upload Blitz catalog
        uses: actions/upload-artifact@v4
        with:
          name: blitz-catalog-snapshot
          path: data/blitz-catalog.json
          if-no-files-found: error
          retention-days: 1
