name: Package App Store IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-and-package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_CERTIFICATE_P12_BASE64: ${{ secrets.APPSTORE_CERTIFICATE_P12_BASE64 }}
      APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
      APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check signing secrets
        shell: bash
        run: |
          for name in APPLE_TEAM_ID APPSTORE_CERTIFICATE_P12_BASE64 APPSTORE_CERTIFICATE_PASSWORD APPSTORE_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install model downloader
        run: python -m pip install --disable-pip-version-check huggingface_hub
      - name: Verify native packaging contract
        run: npm run verify:ios-native
      - name: Download pinned offline cutout model
        run: python scripts/download-ios-model.py
      - name: Export app UI and local model
        run: npm run build:ios-web
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Install App Store signing certificate and profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/cardmaker-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/appstore-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          printf '%s' "$APPSTORE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPSTORE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/appstore-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/appstore-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "CARDMAKER_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CARDMAKER_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "CARDMAKER_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Archive signed iOS app
        run: >-
          xcodebuild
          -project ios/CardMaker.xcodeproj
          -scheme CardMaker
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/CardMaker.xcarchive"
          -derivedDataPath "$RUNNER_TEMP/CardMakerDerived"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY='Apple Distribution'
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PROVISIONING_PROFILE_SPECIFIER="$CARDMAKER_PROFILE_UUID"
          archive
      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/CardMakerIPA"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>com.bobbytatum.cardmaker</key><string>$CARDMAKER_PROFILE_UUID</string></dict>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CardMaker.xcarchive" \
            -exportPath "$RUNNER_TEMP/CardMakerIPA" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: CardMaker-App-Store-IPA
          path: ${{ runner.temp }}/CardMakerIPA/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${CARDMAKER_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$CARDMAKER_KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/appstore-distribution.p12" "$RUNNER_TEMP/appstore.mobileprovision"
