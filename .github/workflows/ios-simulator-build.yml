name: iOS Simulator and Unsigned IPA Build

on:
  push:
    branches: [codex/app-store-ipa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install model downloader
        run: python -m pip install --disable-pip-version-check huggingface_hub
      - name: Verify native packaging contract
        run: npm run verify:ios-native
      - name: Download pinned offline cutout model
        run: python scripts/download-ios-model.py
      - name: Export app UI and local model
        run: npm run build:ios-web
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project ios/CardMaker.xcodeproj
          -scheme CardMaker
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/CardMakerDerived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project ios/CardMaker.xcodeproj
          -scheme CardMaker
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/CardMakerDeviceDerived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/CardMakerDeviceDerived/Build/Products/Release-iphoneos/CardMaker.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/CardMaker"
          xcrun lipo "$APP_PATH/CardMaker" -verify_arch arm64
          plutil -lint "$APP_PATH/Info.plist"
          mkdir -p "$RUNNER_TEMP/CardMaker-UnsignedIPA/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/CardMaker-UnsignedIPA/Payload/CardMaker.app"
          cd "$RUNNER_TEMP/CardMaker-UnsignedIPA"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/CardMaker-unsigned.ipa"
          test -s "$RUNNER_TEMP/CardMaker-unsigned.ipa"
          python3 - "$RUNNER_TEMP/CardMaker-unsigned.ipa" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as ipa:
              names = set(ipa.namelist())
              required = [
                  "Payload/CardMaker.app/Info.plist",
                  "Payload/CardMaker.app/CardMaker",
                  "Payload/CardMaker.app/WebApp/index.html",
                  "Payload/CardMaker.app/WebApp/models/onnx-community/ormbg-ONNX/onnx/model_quantized.onnx",
                  "Payload/CardMaker.app/WebApp/models/onnx-community/ormbg-ONNX/LICENSE.txt",
                  "Payload/CardMaker.app/WebApp/models/onnx-community/ormbg-ONNX/NOTICE.txt",
              ]
              missing = [path for path in required if path not in names]
              if missing:
                  raise SystemExit("IPA is missing required app files: " + ", ".join(missing))
              model = ipa.getinfo(required[3])
              if model.file_size < 40_000_000:
                  raise SystemExit(f"Bundled cutout model is incomplete ({model.file_size} bytes)")
              if any(path.startswith("Payload/CardMaker.app/_CodeSignature/") for path in names):
                  raise SystemExit("Expected an unsigned IPA, but an app signature was found")
              print(f"Verified unsigned device IPA; bundled ONNX model is {model.file_size:,} bytes")
          PY
      - name: Split unsigned IPA for artifact download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/CardMaker-ipa-parts"
          split -b 20971520 -a 2 "$RUNNER_TEMP/CardMaker-unsigned.ipa" "$RUNNER_TEMP/CardMaker-ipa-parts/CardMaker-unsigned.ipa.part-"
          PART_COUNT=$(find "$RUNNER_TEMP/CardMaker-ipa-parts" -type f -name 'CardMaker-unsigned.ipa.part-*' | wc -l | tr -d ' ')
          if [[ "$PART_COUNT" -gt 3 ]]; then
            echo "Unsigned IPA grew beyond the supported three-part download size."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CardMaker-iOS-Simulator
          path: ${{ runner.temp }}/CardMakerDerived/Build/Products/Release-iphonesimulator/CardMaker.app
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CardMaker-iOS-Unsigned-IPA-Part-aa
          path: ${{ runner.temp }}/CardMaker-ipa-parts/CardMaker-unsigned.ipa.part-aa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CardMaker-iOS-Unsigned-IPA-Part-ab
          path: ${{ runner.temp }}/CardMaker-ipa-parts/CardMaker-unsigned.ipa.part-ab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CardMaker-iOS-Unsigned-IPA-Part-ac
          path: ${{ runner.temp }}/CardMaker-ipa-parts/CardMaker-unsigned.ipa.part-ac
          if-no-files-found: ignore
          retention-days: 14
