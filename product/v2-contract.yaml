version: 2
product: AirCard Card Studio
status: required

architecture:
  tabs:
    - Discover
    - Studio
    - Library
    - Export
  studio_tools:
    - Crop
    - Position
    - Adjust
    - Effects
    - Card

required_files:
  - app/page.jsx
  - app/globals.css
  - app/layout.js
  - app/api/cucu/route.js
  - app/api/cucu/inspect/route.js
  - app/api/image/route.js
  - app/lib/storage.js
  - public/sw.js
  - app/manifest.js

forbidden:
  - file: app/page.jsx
    tokens:
      - "Blitz"
      - "['browse', 'Browse']"
      - "['edit', 'Edit']"
      - "['layers', 'Layers']"
      - "Load More"
      - "<span className=\"kicker\">AirCard</span>"
      - "Design Studio"
      - "CUCU Covers"
      - "Searching CUCU"
      - "Loading CUCU"
      - "Search all CUCU card skins"
      - "Load some CUCU card skins first"
  - file: app/layout.js
    tokens:
      - "maximumScale"

features:
  discover_architecture:
    file: app/page.jsx
    contains:
      - "Discover a card skin"
      - "Search 2,225+ card skins"
      - "Recently Added"
      - "Best Sellers"
      - "Anime"
      - "Cars"
      - "Cute & Kawaii"
      - "Memes"
      - "Recently Used"
  minimal_card_actions:
    file: app/page.jsx
    contains:
      - "favoriteButton"
      - "moreButton"
      - "Preview"
      - "Use Skin"
      - "Add to Favorites"
  real_cucu_search:
    file: app/api/cucu/route.js
    contains:
      - "catalog-search"
      - "getFallbackCatalog('all')"
      - "query.split"
  infinite_lazy_loading:
    file: app/page.jsx
    contains:
      - "IntersectionObserver"
      - "loadMoreRef"
      - "rootMargin: '500px 0px'"
  favorites:
    file: app/page.jsx
    contains:
      - "toggleFavorite"
      - "favoriteIds"
      - "dbPut('favorites'"
      - "cacheArtwork(item.image)"
  recent_twenty:
    file: app/page.jsx
    contains:
      - "slice(0, 20)"
      - "Recently Used"
  saved_named_projects:
    file: app/page.jsx
    contains:
      - "saveProject"
      - "projectName"
      - "Name this design"
      - "design: { ...design }"
      - "duplicateProject"
      - "removeProject"
  autosave_indexeddb:
    file: app/page.jsx
    contains:
      - "setSaveStatus('Editing…')"
      - "dbPut('kv'"
      - "420"
  indexeddb_library:
    file: app/lib/storage.js
    contains:
      - "'favorites'"
      - "'projects'"
      - "'imports'"
      - "'exports'"
      - "indexedDB.open"
  undo_redo_50:
    file: app/page.jsx
    contains:
      - "const undo = useCallback"
      - "const redo = useCallback"
      - "slice(-49)"
  before_after:
    file: app/page.jsx
    contains:
      - "Before / After"
      - "setShowOriginal(true)"
      - "original: showOriginal"
  crop_ui:
    file: app/page.jsx
    contains:
      - "Crop Left"
      - "Crop Right"
      - "Crop Top"
      - "Crop Bottom"
      - "updateCropEdge"
      - "originalSourceCrop"
      - "Reset Crop"
  position_controls:
    file: app/page.jsx
    contains:
      - "Artwork zoom"
      - "Artwork horizontal position"
      - "Artwork vertical position"
      - "Artwork rotation"
      - "flipX"
      - "Artwork fit in Position"
      - "Reset Position"
  adjustment_controls:
    file: app/page.jsx
    contains:
      - "Exposure"
      - "Brightness"
      - "Contrast"
      - "Saturation"
      - "Highlights"
      - "Shadows"
      - "Temperature"
      - "Tint"
      - "Sharpness"
      - "Blur"
  adjustment_presets:
    file: app/page.jsx
    contains:
      - "Original"
      - "Vivid"
      - "Dark"
      - "AMOLED"
      - "Warm"
      - "Cold"
      - "Film"
      - "Neon"
      - "Vintage"
      - "Monochrome"
  effects:
    file: app/page.jsx
    contains:
      - "Vignette intensity"
      - "Grain"
      - "Gloss"
      - "Dark Overlay"
      - "Fade"
      - "Color Tint"
      - "Tint Strength"
  card_presets:
    file: app/page.jsx
    contains:
      - "Classic Gold"
      - "Black Metal"
      - "Silver"
      - "Rose Gold"
      - "Minimal"
      - "No Chip"
      - "Full Art"
  direct_manipulation:
    file: app/page.jsx
    contains:
      - "hitTestElement"
      - "selectedElement === 'chip'"
      - "selectedElement === 'contactless'"
      - "lastAngle.current"
      - "setPointerCapture"
  snap_center_thirds_edges:
    file: app/page.jsx
    contains:
      - "snapValue"
      - "1 / 3"
      - "2 / 3"
      - "0.05"
      - "0.95"
  guide_overlays:
    file: app/page.jsx
    contains:
      - "bleedEdge"
      - "cropBoundary"
      - "safeEdge"
      - "textSafe"
      - "chipZone"
      - "contactlessZone"
      - "snapGuide vertical"
      - "snapGuide horizontal"
  physical_preview:
    file: app/page.jsx
    contains:
      - "Flat"
      - "Physical"
      - "physicalChipReflection"
  physical_motion_css:
    file: app/globals.css
    contains:
      - "@keyframes physicalTilt"
      - "@keyframes physicalSheen"
      - "@keyframes chipSheen"
  liquid_glass_hierarchy:
    file: app/globals.css
    contains:
      - ".studioFloatingBar"
      - ".tabBar"
      - "backdrop-filter:saturate(180%) blur(28px)"
  complete_text_layers:
    file: app/page.jsx
    contains:
      - "fontFamily"
      - "Text layer font"
      - "Text alignment"
      - "Font Size"
      - "Weight"
      - "Letter Spacing"
      - "Text Shadow"
      - "Layer X"
      - "Layer Y"
      - "Layer Rotation"
      - "Opacity"
  custom_layer_types:
    file: app/page.jsx
    contains:
      - "+ Text"
      - "+ Image / Logo"
      - "+ Shape"
      - "+ Chip"
      - "+ Contactless"
      - "addChipLayer"
      - "addContactlessLayer"
      - "drawChipLayerAtOrigin"
      - "drawContactlessLayerAtOrigin"
      - "Bring Forward"
      - "Send Back"
      - "Duplicate"
      - "Delete"
      - "Lock Layer"
  unified_z_stack:
    file: app/page.jsx
    contains:
      - "layerOrder"
      - "normalizeLayerOrder"
      - "insertCustomLayerBelowHardware"
      - "isLayerStackEntryVisible"
      - "builtin-chip"
      - "builtin-contactless"
      - "builtin-text"
      - "visualLayerStack"
      - "Top → Bottom"
  selection_escape:
    file: app/page.jsx
    contains:
      - "Done Editing Layer"
      - "doneSelectionButton"
      - "setSelectedElement('artwork')"
  surprise_me:
    file: app/page.jsx
    contains:
      - "surpriseMe"
      - "Surprise Me"
  server_artwork_preprocessing:
    file: app/api/cucu/inspect/route.js
    contains:
      - "import sharp from 'sharp'"
      - "usable"
      - "crop"
      - "thumbnail"
      - "full"
      - "s-maxage=2592000"
  preprocess_client_reuse:
    file: app/page.jsx
    contains:
      - "server-preprocessed"
      - "item.inspectUrls"
      - "meta.thumbnail"
      - "meta.full"
  thumbnail_pipeline:
    file: app/api/cucu/route.js
    contains:
      - "thumbnail: imageProxy"
      - "inspectUrls"
      - "560"
  shopify_thumbnail_downsample:
    file: app/api/image/route.js
    contains:
      - "cdn\\.shopify\\.com"
      - "url.searchParams.set('width'"
  image_edge_cache:
    file: app/api/image/route.js
    contains:
      - "max-age=31536000"
      - "Vercel-CDN-Cache-Control"
  offline_static_and_art_cache:
    file: public/sw.js
    contains:
      - "card-studio-art-v3"
      - "card-studio-static-v3"
      - "/_next/static/"
      - "cacheFirst"
      - "staleWhileRevalidate"
  import_photos_files:
    file: app/page.jsx
    contains:
      - "Import Photo or File"
      - "idb://imports/"
      - 'accept="image/*"'
      - "Crop Left"
  full_screen_export_preview:
    file: app/page.jsx
    contains:
      - "Full-Screen Preview"
      - "fullPreviewCanvasRef"
  full_screen_export_css:
    file: app/globals.css
    contains:
      - ".previewModal"
      - "width:100vw"
      - "height:100dvh"
  export_history:
    file: app/page.jsx
    contains:
      - "recordExport"
      - "Export History"
      - "dbPut('exports'"
  shareable_design_json:
    file: app/page.jsx
    contains:
      - "exportPresetJson"
      - "importPresetJson"
      - ".aircard.json"
      - "payload.assets"
  pwa_install_onboarding:
    file: app/page.jsx
    contains:
      - "Add to Home Screen"
      - "Install Card Studio"
      - "display-mode: standalone"
  expert_mode:
    file: app/page.jsx
    contains:
      - "Expert Mode"
      - "EXPERT VALUES"
      - "Exact numerical access to every global transform, adjustment, effect, and card-hardware parameter."
      - "Effect Tint Strength"
      - "Contactless X"
      - "Chip Rotation"
      - "Exact Layer X"
      - "Exact Layer Rotation"
      - "Exact Font Size"
  accessible_range_values:
    file: app/page.jsx
    contains:
      - "aria-valuetext"
      - "Math.round(value * 100) + '%'"
      - "Chip horizontal position"
      - "Vignette intensity"
  dynamic_type_css:
    file: app/globals.css
    contains:
      - "@supports (font: -apple-system-body)"
  exact_aircard_exports:
    file: app/page.jsx
    contains:
      - "1536 × 969"
      - "1024 × 646"
      - "cardBackgroundCombined@3x.png"
      - "cardBackgroundCombined@2x.png"
